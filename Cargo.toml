[package]
name = "usage-report"
version = "0.1.5"
edition = "2024"
authors = ["leeechsh"]
description = "Cached per-UID disk usage and quota TUI for Linux"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ctrlc = { version = "3.4", features = ["termination"] }
libc = "0.2"
ratatui = "0.30"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
